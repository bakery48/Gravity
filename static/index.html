<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AntiGravity</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --header-bg : #00b900;
      --header-h  : 56px;
      --chat-bg   : #c8c8c8;
      --me-bg     : #5ddd6b;
      --me-text   : #1a1a1a;
      --ai-bg     : #ffffff;
      --ai-text   : #1a1a1a;
      --footer-bg : #f5f5f5;
      --border    : #d0d0d0;
      --send-color: #00b900;
      --radius    : 18px;
      --font      : -apple-system, "Helvetica Neue", sans-serif;
      --ts-color  : #707070;
    }

    html, body { height: 100%; background: var(--chat-bg); font-family: var(--font); }

    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 640px;
      margin: 0 auto;
      background: var(--chat-bg);
    }

    /* ---- ヘッダー ---- */
    header {
      height: var(--header-h);
      background: var(--header-bg);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      flex-shrink: 0;
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
    }

    .hd-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .hd-title {
      flex: 1;
      color: #fff;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: .01em;
    }

    .hd-status {
      display: flex; align-items: center; gap: 5px;
      color: rgba(255,255,255,.85);
      font-size: 12px;
    }

    #status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #fff;
      transition: background .3s;
    }
    #status-dot.thinking { background: #ffe066; animation: blink 1s infinite; }
    #status-dot.offline  { background: #ff6b6b; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    #btn-reset {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
    }
    #btn-reset:active { background: rgba(255,255,255,.3); }

    /* ---- チャット ---- */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
    }

    /* 日付区切り */
    .date-sep {
      text-align: center;
      font-size: 11px;
      color: var(--ts-color);
      background: rgba(0,0,0,.08);
      border-radius: 10px;
      padding: 3px 10px;
      align-self: center;
      margin: 6px 0;
      letter-spacing: .03em;
    }

    /* メッセージ行 */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      animation: fadeIn .15s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

    .msg-row.me   { flex-direction: row-reverse; }
    .msg-row.ai   { flex-direction: row; }

    /* アバター（AI側のみ） */
    .ai-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #4a90d9;
      color: #fff;
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      align-self: flex-end;
    }

    /* バブル */
    .bubble {
      max-width: 72%;
      padding: 10px 13px;
      font-size: 15px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
      position: relative;
    }

    .msg-row.me .bubble {
      background: var(--me-bg);
      color: var(--me-text);
      border-radius: var(--radius) var(--radius) 4px var(--radius);
    }

    .msg-row.ai .bubble {
      background: var(--ai-bg);
      color: var(--ai-text);
      border-radius: var(--radius) var(--radius) var(--radius) 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,.12);
    }

    /* タイムスタンプ */
    .ts {
      font-size: 10px;
      color: var(--ts-color);
      align-self: flex-end;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Markdownレンダリング */
    .bubble strong { font-weight: 700; }
    .bubble em     { font-style: italic; }
    .bubble code {
      background: rgba(0,0,0,.07);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: "SF Mono", Consolas, monospace;
      font-size: .88em;
    }
    .bubble pre {
      background: rgba(0,0,0,.07);
      border-radius: 8px;
      padding: 10px;
      overflow-x: auto;
      margin: 6px 0;
      font-family: "SF Mono", Consolas, monospace;
      font-size: .85em;
    }
    .bubble pre code { background: none; padding: 0; }
    .bubble h1,.bubble h2,.bubble h3 { font-weight: 700; margin: 4px 0 2px; }
    .bubble hr { border: none; border-top: 1px solid rgba(0,0,0,.1); margin: 8px 0; }

    /* 入力中インジケーター */
    .typing-row {
      display: flex; align-items: flex-end; gap: 6px;
    }
    .typing-bubble {
      background: var(--ai-bg);
      border-radius: var(--radius) var(--radius) var(--radius) 4px;
      padding: 12px 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,.12);
      display: flex; gap: 5px; align-items: center;
    }
    .typing-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #aaa;
      animation: bounce 1.2s infinite;
    }
    .typing-dot:nth-child(2){animation-delay:.2s}
    .typing-dot:nth-child(3){animation-delay:.4s}
    @keyframes bounce {
      0%,80%,100%{transform:translateY(0);opacity:.5}
      40%{transform:translateY(-5px);opacity:1}
    }

    /* ---- フッター（入力欄） ---- */
    footer {
      background: var(--footer-bg);
      border-top: 1px solid var(--border);
      padding: 8px 10px;
      flex-shrink: 0;
    }

    #form {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    #input-wrap {
      flex: 1;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 9px 14px;
      display: flex;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      border: none;
      outline: none;
      font-family: var(--font);
      font-size: 15px;
      color: #1a1a1a;
      resize: none;
      max-height: 110px;
      overflow-y: auto;
      line-height: 1.5;
      background: transparent;
    }

    #input::placeholder { color: #aaa; }

    #btn-send {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--send-color);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity .15s, transform .1s;
    }
    #btn-send:disabled { opacity: .35; cursor: default; }
    #btn-send:not(:disabled):active { transform: scale(.92); }
    #btn-send svg { width: 20px; height: 20px; fill: #fff; margin-left: 2px; }

    /* MD モーダル */
    #md-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.6); z-index: 200;
      padding: 20px 14px; overflow-y: auto;
    }
    #md-modal.open { display: block; }
    #md-box {
      background: #fff; border-radius: 12px;
      padding: 18px; max-width: 640px; margin: 0 auto;
    }
    #md-box header {
      background: none; height: auto;
      display: flex; justify-content: space-between; align-items: center;
      color: #333; font-weight: 700; font-size: 15px;
      box-shadow: none; padding: 0 0 12px;
      border-bottom: 1px solid #eee; margin-bottom: 12px;
    }
    #btn-md-close {
      background: none; border: none; font-size: 22px;
      cursor: pointer; color: #888; padding: 0;
    }
    #md-raw {
      white-space: pre-wrap; font-family: "SF Mono", Consolas, monospace;
      font-size: 12px; color: #333; line-height: 1.7;
    }
    #btn-md-view {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 8px; color: #fff;
      font-size: 12px; padding: 5px 10px; cursor: pointer;
    }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="hd-avatar">⚡</div>
    <div class="hd-title">AntiGravity</div>
    <div class="hd-status">
      <div id="status-dot"></div>
      <span id="status-txt">接続中...</span>
    </div>
    <button id="btn-md-view"  onclick="openMd()">MD</button>
  </header>

  <div id="chat"></div>

  <footer>
    <div id="form">
      <div id="input-wrap">
        <textarea id="input" rows="1"
          placeholder="メッセージを入力"
          oninput="onInput()"
          onkeydown="onKey(event)"></textarea>
      </div>
      <button id="btn-send" disabled onclick="send()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </footer>
</div>

<!-- MD表示モーダル -->
<div id="md-modal" onclick="closeMdBg(event)">
  <div id="md-box">
    <header>
      <span>output.md</span>
      <button id="btn-md-close" onclick="closeMd()">×</button>
    </header>
    <pre id="md-raw">読み込み中...</pre>
  </div>
</div>

<script>
'use strict';

const chatEl   = document.getElementById('chat');
const inputEl  = document.getElementById('input');
const sendBtn  = document.getElementById('btn-send');
const statusDot = document.getElementById('status-dot');
const statusTxt = document.getElementById('status-txt');

let busy = false;
let typingRow = null;

// ---- 入力ハンドリング ----
function onInput() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + 'px';
  sendBtn.disabled = !inputEl.value.trim() || busy;
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!sendBtn.disabled) send();
  }
}

// ---- 送信 ----
async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;
  setBusy(true);

  addMe(text);
  showTyping();

  try {
    const r = await fetch('/api/send', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({message: text})
    });
    if (!r.ok) throw new Error('送信失敗');
  } catch (err) {
    hideTyping();
    addAi(`[エラー] ${err.message}`);
    setBusy(false);
  }
}

// ---- バブル追加 ----
function addMe(text) {
  const row = el('div', 'msg-row me');
  const ts  = el('div', 'ts', now());
  const bub = el('div', 'bubble', null, text);
  row.append(ts, bub);
  chatEl.append(row);
  scrollEnd();
}

function addAi(text) {
  const row    = el('div', 'msg-row ai');
  const avatar = el('div', 'ai-avatar', null, '⚡');
  const bub    = el('div', 'bubble');
  bub.innerHTML = md(text);
  const ts = el('div', 'ts', null, now());
  row.append(avatar, bub, ts);
  chatEl.append(row);
  scrollEnd();
}

function showTyping() {
  typingRow = el('div', 'typing-row');
  const avatar = el('div', 'ai-avatar', null, '⚡');
  const bub = el('div', 'typing-bubble');
  bub.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  typingRow.append(avatar, bub);
  chatEl.append(typingRow);
  scrollEnd();
}

function hideTyping() {
  typingRow?.remove();
  typingRow = null;
}

// ---- 状態 ----
function setBusy(v) {
  busy = v;
  sendBtn.disabled = v || !inputEl.value.trim();
  statusDot.className = v ? 'thinking' : '';
  statusTxt.textContent = v ? '考え中...' : 'オンライン';
}

function scrollEnd() { chatEl.scrollTop = chatEl.scrollHeight; }

function now() {
  return new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
}

// ---- DOM ヘルパー ----
function el(tag, cls, id, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (id)  e.id = id;
  if (text != null) e.textContent = text;
  return e;
}

// ---- シンプル Markdown レンダラー ----
function md(raw) {
  let s = raw
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (_,l,c) => `<pre><code>${c.trim()}</code></pre>`)
    .replace(/`([^`]+)`/g, (_,c) => `<code>${c}</code>`)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,     '<em>$1</em>')
    .replace(/^### (.+)$/gm,   '<h3>$1</h3>')
    .replace(/^## (.+)$/gm,    '<h2>$1</h2>')
    .replace(/^# (.+)$/gm,     '<h1>$1</h1>')
    .replace(/^---$/gm,        '<hr>')
    .replace(/\n/g,            '<br>');
  return s;
}

// ---- MD 表示 ----
async function openMd() {
  document.getElementById('md-modal').classList.add('open');
  const r = await fetch('/api/md');
  document.getElementById('md-raw').textContent = await r.text();
}
function closeMd() { document.getElementById('md-modal').classList.remove('open'); }
function closeMdBg(e) { if (e.target.id === 'md-modal') closeMd(); }

// ---- SSE ----
function connectSSE() {
  const es = new EventSource('/api/events');

  es.onopen = () => {
    statusDot.className = '';
    statusTxt.textContent = 'オンライン';
  };

  es.onmessage = async e => {
    const d = JSON.parse(e.data);

    if (d.type === 'thinking') {
      // already shown via showTyping()
    } else if (d.type === 'md_update') {
      // MDファイルが更新された差分を返答として表示
      hideTyping();
      addAi(d.text);
      setBusy(false);
      if (document.getElementById('md-modal').classList.contains('open')) openMd();
    } else if (d.type === 'error') {
      hideTyping();
      addAi(d.text);
      setBusy(false);
    }
  };

  es.onerror = () => {
    statusDot.className = 'offline';
    statusTxt.textContent = '切断 — 再接続中...';
    es.close();
    setTimeout(connectSSE, 3000);
  };
}

// ---- 起動 ----
connectSSE();
</script>
</body>
</html>
