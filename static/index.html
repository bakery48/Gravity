<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AntiGravity Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #252836;
      --border: #2e3248;
      --accent: #7c6af7;
      --accent-dim: #4a4080;
      --text: #e2e4f0;
      --text-dim: #8890b0;
      --user-bg: #2d2060;
      --ai-bg: #1e2235;
      --danger: #e05c5c;
      --radius: 16px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 680px;
      margin: 0 auto;
    }

    /* ---- ヘッダー ---- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 8px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
    }

    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    #status-dot.thinking { background: #facc15; animation: pulse 1s infinite; }
    #status-dot.offline  { background: #ef4444; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #btn-reset {
      padding: 6px 12px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s;
    }
    #btn-reset:active { background: var(--surface2); }

    #btn-md-view {
      padding: 6px 12px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s;
    }
    #btn-md-view:active { background: var(--surface2); }

    /* ---- チャットエリア ---- */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    #chat:empty::after {
      content: "メッセージを送ってみてください";
      color: var(--text-dim);
      font-size: 14px;
      text-align: center;
      margin: auto;
      align-self: center;
    }

    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: var(--radius);
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bubble.user {
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
      align-self: flex-end;
      border: 1px solid #3d2c80;
    }

    .bubble.ai {
      background: var(--ai-bg);
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      border: 1px solid var(--border);
    }

    .bubble.ai code {
      background: var(--surface2);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.9em;
      font-family: "SF Mono", Consolas, monospace;
    }

    .bubble.ai pre {
      background: var(--surface2);
      border-radius: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 0.88em;
      font-family: "SF Mono", Consolas, monospace;
    }

    .bubble.ai pre code { background: none; padding: 0; }

    .bubble-role {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .thinking-indicator {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 12px 16px;
      background: var(--ai-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      align-self: flex-start;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* ---- MD表示モーダル ---- */
    #md-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      padding: 16px;
      overflow-y: auto;
    }

    #md-modal.open { display: block; }

    #md-content-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      max-width: 680px;
      margin: 0 auto;
    }

    #md-content-box h2 {
      font-size: 14px;
      color: var(--text-dim);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #btn-md-close {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 20px;
      cursor: pointer;
      padding: 0 4px;
    }

    #md-raw {
      white-space: pre-wrap;
      font-family: "SF Mono", Consolas, monospace;
      font-size: 12px;
      color: var(--text);
      line-height: 1.7;
      word-break: break-word;
    }

    /* ---- 入力エリア ---- */
    footer {
      padding: 12px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #form {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 15px;
      color: var(--text);
      font-family: var(--font);
      resize: none;
      outline: none;
      max-height: 120px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      line-height: 1.5;
    }

    #input:focus { border-color: var(--accent); }
    #input::placeholder { color: var(--text-dim); }

    #btn-send {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }

    #btn-send:disabled { opacity: 0.4; cursor: default; }
    #btn-send:not(:disabled):active { opacity: 0.75; }

    #btn-send svg { width: 20px; height: 20px; fill: white; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>⚡ AntiGravity</h1>
    <div id="status">
      <div id="status-dot"></div>
      <span id="status-text">接続中...</span>
    </div>
    <button id="btn-md-view" onclick="openMd()">MD</button>
    <button id="btn-reset" onclick="resetChat()">リセット</button>
  </header>

  <div id="chat"></div>

  <footer>
    <div id="form">
      <textarea
        id="input"
        rows="1"
        placeholder="メッセージを入力..."
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button id="btn-send" onclick="sendMessage()" disabled>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </footer>
</div>

<!-- MD表示モーダル -->
<div id="md-modal" onclick="closeMdOutside(event)">
  <div id="md-content-box">
    <h2>
      output.md の内容
      <button id="btn-md-close" onclick="closeMd()">×</button>
    </h2>
    <pre id="md-raw">読み込み中...</pre>
  </div>
</div>

<script>
  const chatEl  = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('btn-send');
  const statusDot  = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');

  let isBusy = false;
  let thinkingEl = null;

  // ---- 入力フィールド ----
  inputEl.addEventListener('input', () => {
    sendBtn.disabled = inputEl.value.trim() === '' || isBusy;
  });

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.shiftKey) {
      if (!sendBtn.disabled) { e.preventDefault(); sendMessage(); }
    }
  }

  // ---- メッセージ送信 ----
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isBusy) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    setBusy(true);

    appendBubble('user', text);
    showThinking();

    try {
      const res = await fetch('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      if (!res.ok) throw new Error('送信失敗');
    } catch (e) {
      hideThinking();
      appendBubble('ai', `[エラー] ${e.message}`);
      setBusy(false);
    }
  }

  function setBusy(v) {
    isBusy = v;
    sendBtn.disabled = v || inputEl.value.trim() === '';
    statusDot.className = v ? 'thinking' : '';
    statusText.textContent = v ? '考え中...' : '接続済み';
  }

  // ---- チャット表示 ----
  function appendBubble(role, text) {
    const wrap = document.createElement('div');
    wrap.className = `bubble ${role}`;

    const lbl = document.createElement('div');
    lbl.className = 'bubble-role';
    lbl.textContent = role === 'user' ? 'あなた' : 'AntiGravity';
    wrap.appendChild(lbl);

    const body = document.createElement('div');
    body.innerHTML = renderMarkdown(text);
    wrap.appendChild(body);

    chatEl.appendChild(wrap);
    scrollBottom();
    return wrap;
  }

  function showThinking() {
    thinkingEl = document.createElement('div');
    thinkingEl.className = 'thinking-indicator';
    thinkingEl.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    chatEl.appendChild(thinkingEl);
    scrollBottom();
  }

  function hideThinking() {
    if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
  }

  function scrollBottom() {
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  // ---- シンプルなMarkdownレンダラー ----
  function renderMarkdown(text) {
    // コードブロック
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${escHtml(code.trim())}</code></pre>`);
    // インラインコード
    text = text.replace(/`([^`]+)`/g, (_, c) => `<code>${escHtml(c)}</code>`);
    // 太字
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // 斜体
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // 見出し
    text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    text = text.replace(/^# (.+)$/gm, '<h1>$1</h1>');
    // 水平線
    text = text.replace(/^---$/gm, '<hr>');
    // 改行
    text = text.replace(/\n/g, '<br>');
    return text;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ---- 履歴復元 ----
  async function loadHistory() {
    try {
      const res = await fetch('/api/history');
      const history = await res.json();
      chatEl.innerHTML = '';
      history.forEach(msg => appendBubble(msg.role === 'user' ? 'user' : 'ai', msg.content));
    } catch (e) { /* ignore */ }
  }

  // ---- リセット ----
  async function resetChat() {
    if (!confirm('会話をリセットしますか？')) return;
    await fetch('/api/reset', { method: 'POST' });
    chatEl.innerHTML = '';
  }

  // ---- MD表示 ----
  async function openMd() {
    document.getElementById('md-modal').classList.add('open');
    await refreshMd();
  }

  function closeMd() {
    document.getElementById('md-modal').classList.remove('open');
  }

  function closeMdOutside(e) {
    if (e.target === document.getElementById('md-modal')) closeMd();
  }

  async function refreshMd() {
    try {
      const res = await fetch('/api/md');
      const text = await res.text();
      document.getElementById('md-raw').textContent = text;
    } catch (e) { /* ignore */ }
  }

  // ---- SSE (リアルタイム更新) ----
  function connectSSE() {
    const es = new EventSource('/api/events');

    es.onopen = () => {
      statusDot.className = '';
      statusText.textContent = '接続済み';
    };

    es.onmessage = async (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'thinking') {
        // already shown
      } else if (data.type === 'update') {
        hideThinking();
        // 最新の履歴を取得して最後のAIメッセージを表示
        const res = await fetch('/api/history');
        const history = await res.json();
        const last = history.filter(m => m.role === 'assistant').pop();
        if (last) appendBubble('ai', last.content);
        setBusy(false);
        // MDモーダルが開いていれば更新
        if (document.getElementById('md-modal').classList.contains('open')) refreshMd();
      }
    };

    es.onerror = () => {
      statusDot.className = 'offline';
      statusText.textContent = '切断 — 再接続中...';
      es.close();
      setTimeout(connectSSE, 3000);
    };
  }

  // ---- 初期化 ----
  loadHistory().then(() => connectSSE());
</script>
</body>
</html>
